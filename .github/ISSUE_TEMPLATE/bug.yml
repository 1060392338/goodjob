name: 缺陷
description: 报告可复现并可回归验证的问题
title: "[BUG-GJ-XXX] "
labels: ["type:bug", "status:triage"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: 严重等级
      options: ["P0", "P1", "P2", "P3"]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与环境
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志、截图、Trace ID 或失败测试
  - type: textarea
    id: regression
    attributes:
      label: 回归测试与关闭条件
    validations:
      required: true
